{% extends "votes_base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="login">
  <form class="card" method="post" action="{{ url_for('votes_login') }}">
    <h1>Voting App</h1>
    <p class="muted">Enter the password to see and cast votes.</p>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
           {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
    {% if error %}<p id="login-error" class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primary">Sign in</button>
  </form>
</main>
{% endblock %}
